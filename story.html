<!DOCTYPE html>
<html lang="hi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>कहानी पढ़ें - अपनी कहानियाँ</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans Devanagari", sans-serif;
      background: #f7f3ed;
      color: #333;
    }

    header {
      background: #8b4513;
      color: white;
      padding: 18px 15px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    .story-container {
      max-width: 850px;
      margin: 25px auto;
      padding: 15px;
    }

    .story-box {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.10);
    }

    .story-title {
      margin-top: 0;
      margin-bottom: 12px;
      color: #8b4513;
      font-size: 32px;
      line-height: 1.35;
    }

    .meta {
      color: #777;
      font-size: 15px;
      margin-bottom: 22px;
      padding-bottom: 15px;
      border-bottom: 1px solid #ddd;
    }

    .story-text {
      font-size: 19px;
      line-height: 1.75;
    }

    .story-text p {
      margin: 0 0 16px 0;
    }

    .story-text p:last-child {
      margin-bottom: 0;
    }

    .back-button {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 20px;
      background: #8b4513;
      color: white;
      text-decoration: none;
      border-radius: 7px;
    }

    .back-button:hover {
      background: #6f350f;
    }

    .not-found {
      text-align: center;
      padding: 30px;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #777;
      margin-top: 25px;
    }

    @media (max-width: 600px) {

      .story-container {
        margin: 10px auto;
        padding: 10px;
      }

      .story-box {
        padding: 20px;
      }

      .story-title {
        font-size: 26px;
        line-height: 1.35;
      }

      .story-text {
        font-size: 18px;
        line-height: 1.7;
      }

      .story-text p {
        margin-bottom: 14px;
      }

      .back-button {
        width: 100%;
        text-align: center;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>📖 अपनी कहानियाँ</h1>
  </header>

  <main class="story-container">

    <div class="story-box" id="storyContent">

      <div class="not-found">
        <h2>कहानी लोड हो रही है...</h2>
      </div>

    </div>

    <a class="back-button" href="index.html">
      ← वापस कहानियों पर जाएँ
    </a>

  </main>

  <footer>
    © 2026 अपनी कहानियाँ
  </footer>


  <script>

    const data = localStorage.getItem("selectedStory");

    const storyContent = document.getElementById("storyContent");

    if (data) {

      try {

        const story = JSON.parse(data);

        const title = escapeHtml(
          story.title || "बिना शीर्षक"
        );

        const author = escapeHtml(
          story.author || "अज्ञात लेखक"
        );

        const category = escapeHtml(
          story.cat || "सामान्य"
        );

        const rawText = String(
          story.text || "कहानी उपलब्ध नहीं है।"
        );

        /*
          कहानी को छोटे-छोटे पैराग्राफ में दिखाएँ।
          इससे ज्यादा खाली जगह नहीं आएगी।
        */

        const paragraphs = rawText
          .split(/\n\s*\n/)
          .map(function(paragraph) {

            return paragraph.trim();

          })
          .filter(function(paragraph) {

            return paragraph.length > 0;

          })
          .map(function(paragraph) {

            return "<p>" + escapeHtml(paragraph) + "</p>";

          })
          .join("");


        storyContent.innerHTML = `

          <h2 class="story-title">
            ${title}
          </h2>

          <div class="meta">
            ✍️ लेखक: ${author}
            &nbsp; | &nbsp;
            📚 श्रेणी: ${category}
          </div>

          <div class="story-text">
            ${paragraphs}
          </div>

        `;

        document.title = title + " - अपनी कहानियाँ";

      }

      catch (error) {

        storyContent.innerHTML = `

          <div class="not-found">

            <h2>कहानी नहीं मिली</h2>

            <p>
              कृपया होम पेज से कहानी दोबारा खोलें।
            </p>

          </div>

        `;

      }

    }

    else {

      storyContent.innerHTML = `

        <div class="not-found">

          <h2>कहानी नहीं मिली</h2>

          <p>
            कृपया होम पेज पर जाकर किसी कहानी पर क्लिक करें।
          </p>

        </div>

      `;

    }


    function escapeHtml(text) {

      return String(text).replace(
        /[&<>"']/g,
        function(m) {

          return {

            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"

          }[m];

        }
      );

    }

  </script>

</body>

</html>
